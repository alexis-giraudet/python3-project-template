# See https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# See https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "python3-project-template"
description = "Python 3 project template"
dynamic = ["version"]
authors = [{ name = "Alexis Giraudet", email = "alexis.giraudet@nav-timing.safrangroup.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["template", "demo", "project"]
dependencies = ["textual", "python-libeconf"]
requires-python = ">=3.10"
# See https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test_requires = ["pytest"]

[project.urls]
Repository = "https://github.com/alexis-giraudet/python3-project-template.git"

[project.scripts]
myapplication-cli = "mynamespace.myproject.cli:main"
myapplication-tui = "mynamespace.myproject.tui:main"

[tool.setuptools.dynamic]
version = { attr = "mynamespace.myproject.__version__" }
